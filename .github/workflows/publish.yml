name: Publish to Python Package Index

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: Where to publish this checked-out revision
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.repository || (github.event.release.prerelease && 'testpypi' || 'pypi') }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      # Keep the OIDC subject distinct for the two package indexes.
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.repository || (github.event.release.prerelease && 'testpypi' || 'pypi') }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi' || github.event_name == 'release' && github.event.release.prerelease) && 'https://test.pypi.org/legacy/' || '' }}
          skip-existing: true
          attestations: true
