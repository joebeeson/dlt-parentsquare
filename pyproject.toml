[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dlt-parentsquare"
version = "0.3.0"
description = "dlt resources for the shared ParentSquare client"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Joe Beeson" }]
keywords = ["parentsquare", "dlt", "school", "calendar"]
dependencies = [
  "parentsquare-client>=0.2.4,<0.3",
]

[project.optional-dependencies]
dlt = ["dlt>=1.31,<2"]
duckdb = ["dlt>=1.31,<2", "duckdb>=1.1,<3"]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "pytest-datadir>=1,<2",
  "pytest-asyncio>=1,<2",
  "pyrefly>=1.4,<2",
  "ruff>=0.8,<1",
]

[project.urls]
Homepage = "https://github.com/joebeeson/dlt-parentsquare"
Repository = "https://github.com/joebeeson/dlt-parentsquare"
Issues = "https://github.com/joebeeson/dlt-parentsquare/issues"

# uv-only development override. Build metadata still contains the normal
# PyPI dependency above, so published users resolve the released client.
[tool.uv.sources]
parentsquare-client = { git = "https://github.com/joebeeson/parentsquare-client.git", tag = "v0.2.4" }

[tool.hatch.build.targets.wheel]
packages = ["src/dlt_parentsquare"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyrefly]
project-includes = [
    "src/**/*.py",
]
