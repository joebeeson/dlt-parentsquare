[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dlt-parentsquare"
version = "0.1.0"
description = "dlt resources for the shared ParentSquare client"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Joe Beeson" }]
keywords = ["parentsquare", "dlt", "school", "calendar"]
dependencies = [
  "parentsquare-client @ git+https://github.com/joebeeson/parentsquare-client.git@v0.1.0",
]

[project.optional-dependencies]
dlt = ["dlt>=1.31,<2"]
duckdb = ["dlt>=1.31,<2", "duckdb>=1.1,<2"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.urls]
Homepage = "https://github.com/joebeeson/dlt-parentsquare"
Repository = "https://github.com/joebeeson/dlt-parentsquare"
Issues = "https://github.com/joebeeson/dlt-parentsquare/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dlt_parentsquare"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
